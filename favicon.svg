<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background preto -->
  <rect width="512" height="512" fill="#000000"/>
  
  <!-- Ícone Kronos (ampulheta com triângulos) -->
  <g transform="translate(256, 256)">
    <!-- Triângulo superior -->
    <path d="M -80 -120 L 80 -120 L 0 -20 Z" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Triângulo superior interno -->
    <path d="M -50 -90 L 50 -90 L 0 -30 Z" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
    
    <!-- Triângulo inferior -->
    <path d="M -80 120 L 80 120 L 0 20 Z" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Triângulo inferior interno -->
    <path d="M -50 90 L 50 90 L 0 30 Z" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
    
    <!-- Conector central (nó) -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="#FFFFFF" stroke-width="12"/>
    <path d="M -15 -15 Q 0 0 15 15" fill="none" stroke="#FFFFFF" stroke-width="8"/>
    <path d="M 15 -15 Q 0 0 -15 15" fill="none" stroke="#FFFFFF" stroke-width="8"/>
  </g>
</svg>
